workflows:
  vibe-player-android:
    name: Vibe Player Android Signed APK
    max_build_duration: 120

    environment:
      java: 17
      android_signing:
        - paliaapk-release

    scripts:
      - name: Verify Gradle wrapper
        script: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build signed release APK
        script: |
          ./gradlew --no-daemon --stacktrace assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - shanpalia786@gmail.com
        notify:
          success: true
          failure: true
