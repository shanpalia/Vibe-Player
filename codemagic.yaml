workflows:
  vibe-player-android:
    name: Vibe Player Android Signed APK
    max_build_duration: 120

    environment:
      java: 17
      android_signing:
        - paliaapk-release

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build signed release APK
        script: |
          gradle --no-daemon --stacktrace assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - shanpalia786@gmail.com
        notify:
          success: true
          failure: true
