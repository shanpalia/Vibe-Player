workflows:
  vibe-player-android:
    name: Vibe Player Android Signed APK
    max_build_duration: 120

    environment:
      java: 17
      android_signing:
        - paliaapk-release

    scripts:
      - name: Prepare build environment
        script: |
          printf "%s\n" "# Vibe Player build - no secrets required" > .env.example

      - name: Verify Gradle wrapper
        script: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Remove obsolete background playback service
        script: |
          rm -rf app/src/main/java/com/example/service
          if grep -RInE "androidx\.media3\.session|MediaSession" app/src 2>/dev/null; then
            echo "Obsolete media session references detected"
            exit 1
          fi

      - name: Build signed release APK
        script: |
          ./gradlew --no-daemon --stacktrace clean assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - shanpalia786@gmail.com
        notify:
          success: true
          failure: true
